# FeI2 -- dipole LSWT about the TRUE classical ground state.
#
# THIS FILE USED TO OPEN WITH:
#     # on_imaginary: warn -- the supplied structure is not the exact classical
#     # minimum of this Hamiltonian. Flagged by the guard; needs investigation.
# It is investigated, and the answer is below. The guard was right.
#
# FeI2 orders as a COLLINEAR 2-up-2-down stripe with k = (0, -1/4, 1/4), and a
# rotating-frame `propagation_vector`/`single_k` structure CANNOT represent that:
# that form rotates each successive cell by a fixed angle, so at k = 1/4 it gives
# up / in-plane / down / in-plane. This config asserted exactly such a spiral and
# sat ~2.5 meV/site above the minimum (-0.403 vs -2.898 meV/site), with
# `on_imaginary: warn` carrying it past the guard.
#
# The fix is the real-space commensurate cell (k = 1/4 -> 4x along b and c) with
# the ground state SEARCHED FOR rather than asserted. Monte-Carlo annealing reaches
# E = -46.372796 meV per 16-site cell = -2.898300 meV/site, reproducibly (3-4 of 4
# runs on seeds 0, 1, 2, 7). The guards now run at their default `error`.
#
# NOTE ON MODE: this is the DIPOLE engine, so -2.8983 meV/site is the classical
# DIPOLE minimum. It is deliberately NOT the SU(N) ground state (-2.91893118
# meV/site): a coherent state has <Sz^2> != (S n_z)^2, so with an anisotropy the
# two genuinely differ (CLAUDE.md 5c). FeI2's famous bound state is a single-ion
# excitation dipole LSWT structurally cannot show -- the engine warns about that on
# every run of this file. For the physics use `config_fei2_sun.yaml`, which is
# validated against Sunny band by band. This one is the dipole reference.
#
# `tests/test_sun.py` reads this file as its HAMILTONIAN source and strips the two
# structure keys in memory (see `_fei2_cfg` there), so the Sunny-pinned SU(N)
# comparisons keep the chemical cell and their own non-diagonal supercell. That
# separation is what made fixing the structure here possible at all.
experiment:
  name: FeI2_LSWT
  description: Replication of Sunny.jl FeI2 tutorial (Anisotropic Exchange + SIA)
crystal_structure:
  lattice_parameters:
    space_group: 164
    a: 4.05012
    b: 4.05012
    c: 6.75214
    alpha: 90
    beta: 90
    gamma: 120
  wyckoff_atoms:
  - label: Fe
    element: Fe
    wyckoff: 1a
    pos: [0, 0, 0]
    spin_S: 1.0
    charge: 2
  atom_mode: symmetry
  magnetic_elements: [Fe]
  # k = (0, -1/4, 1/4) -> 4x along b and c. Declared explicitly rather than 'auto'
  # because there is no `magnetic_structure` block for 'auto' to read.
  magnetic_supercell: [1, 4, 4]
parameters:
  J1pm: -0.236
  J1pmpm: -0.161
  J1zpm: -0.261
  J1zz: -0.236
  J1xx: -0.397
  J1yy: -0.075
  J1yz: -0.261
  J2pm: 0.026
  J2zz: 0.113
  J3pm: 0.166
  J3zz: 0.211
  Jp0pm: 0.037
  Jp0zz: -0.036
  Jp1pm: 0.013
  Jp1zz: 0.051
  Jp2apm: 0.068
  Jp2azz: 0.073
  D: 2.165
interactions:
  single_ion_anisotropy:
  - value: -2.165
    axis: [0, 0, 1]
    atoms: [Fe]
  symmetry_rules:
  - name: J1
    type: interaction_matrix
    value:
    - [-0.397, 0.0, 0.0]
    - [0.0, -0.075, -0.261]
    - [0.0, -0.261, -0.236]
    ref_pair: [Fe, Fe]
    distance: 4.05
    offset: [1, 0, 0]
  - name: J2
    type: interaction_matrix
    value:
    - [0.026, 0.0, 0.0]
    - [0.0, 0.026, 0.0]
    - [0.0, 0.0, 0.113]
    ref_pair: [Fe, Fe]
    distance: 7.015
    offset: [1, 2, 0]
  - name: J3
    type: interaction_matrix
    value:
    - [0.166, 0.0, 0.0]
    - [0.0, 0.166, 0.0]
    - [0.0, 0.0, 0.211]
    ref_pair: [Fe, Fe]
    distance: 8.1
    offset: [2, 0, 0]
  - name: J_prime_0
    type: interaction_matrix
    value:
    - [0.037, 0.0, 0.0]
    - [0.0, 0.037, 0.0]
    - [0.0, 0.0, -0.036]
    ref_pair: [Fe, Fe]
    distance: 6.75
    offset: [0, 0, 1]
  - name: J_prime_1
    type: interaction_matrix
    value:
    - [0.013, 0.0, 0.0]
    - [0.0, 0.013, 0.0]
    - [0.0, 0.0, 0.051]
    ref_pair: [Fe, Fe]
    distance: 7.87
    offset: [1, 0, 1]
  - name: J_prime_2a
    type: interaction_matrix
    value:
    - [0.068, 0.0, 0.0]
    - [0.0, 0.068, 0.0]
    - [0.0, 0.0, 0.073]
    ref_pair: [Fe, Fe]
    distance: 9.74
    offset: [1, 2, 1]
# No `magnetic_structure`: the ground state is SEARCHED FOR, not asserted -- that is
# the whole correction here. Annealing crosses barriers, which a 16-site frustrated
# easy-axis cell needs (CLAUDE.md, "Finding the ground state").
minimization: {enabled: true, method: anneal, num_starts: 4, n_sweeps: 2000, seed: 0}
plotting:
  show_plot: false
  save_plot: true
  disp_plot_filename: disp_plot.png
  show_structure: false
q_path:
  Gamma: [0, 0, 0]
  M: [0.5, 0, 0]
  K: [0.3333, 0.3333, 0]
  A: [0, 0, 0.5]
  path: [Gamma, M, K, Gamma, A]
  points_per_segment: 50
tasks:
  minimization: true
  dispersion: true
