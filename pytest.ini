[pytest]
# Default run = the FAST suite: every feature keeps at least one quick pinned
# test. The `slow` marker holds the deep/expensive validations (ED oracles,
# convergence sweeps, long integration runs, ~8 s+ each).
#
#   pytest              -> fast suite (default, for iteration)
#   pytest -m slow      -> only the deep validations
#   pytest -m ""        -> EVERYTHING -- required before merging to master
#
# Runs are PARALLEL (pytest-xdist). Measured on a 10-core M-series, 2026-08-17:
#
#   suite                serial     -n auto --dist worksteal
#   fast   (697 tests)   6 m 07 s   4 m 37 s
#   FULL   (883 tests)   33 m       12 m 20 s
#
# The gate wins far more than the fast suite because it is dominated by a handful
# of multi-minute serial tests that previously ran end to end (the longest, alone,
# is ~7 min: test_classical_absolute_normalization's 128-trajectory LL average).
# Nothing is deselected -- the full gate still reports 882 passed, 1 skipped.
#
# `worksteal` (not xdist's default `load`) matters: `load` deals tests out in
# collection order up front, so a worker that draws a 7-minute test late leaves
# every other worker idle at the tail. Measured 17 m 32 s vs 12 m 20 s.
#
# Setting OMP_NUM_THREADS=1 & co. was tried and does NOT help (12 m 21 s
# unpinned vs 12 m 28 s pinned, same total CPU) -- BLAS threading and xdist
# processes are not fighting here, so don't add env plumbing for it.
#
# TO DEBUG, DISABLE IT: `pytest -n0 ...`. Under xdist there is no live per-test
# name, `-s`/pdb do not attach, and the "N deselected" count is not reported.
# `-n0` restores serial behaviour exactly (single test: 3.5 s either way, vs
# 4.7 s with workers spun up).
addopts = -m "not slow" -n auto --dist worksteal
markers =
    slow: deep/expensive validation; excluded from the default run (see pytest.ini)

# Scope collection to tests/, as the workspace-root pytest.ini already does for
# its own runs. Without this, bare `pytest` from inside pyMagCalc/ walks the whole
# project and DIES DURING COLLECTION on stale scratch scripts under archive/
# (named test_*.py but not tests: missing CIFs, outdated MagCalcConfigBuilder
# signatures) -- so the documented iteration command aborted with 3 collection
# errors and ran nothing at all. The root config carried this guard and the
# per-project one did not.
testpaths =
    tests

norecursedirs =
    archive
    scripts
    tmp
    build
    cache
    plots
    examples
    native
    .git
    gui
    *.egg-info
    __pycache__
